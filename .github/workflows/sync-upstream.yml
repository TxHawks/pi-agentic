name: Sync Upstream

on:
  schedule:
    # Every day at 08:00 UTC.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  SYNC_BRANCH: sync/upstream
  UPSTREAM_BRANCH: main
  UPSTREAM_REPOSITORY: edxeth/pi-subagents

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Fetch upstream and prepare pull request
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags --prune upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          upstream_ref="refs/remotes/upstream/${UPSTREAM_BRANCH}"
          if ! merge_base=$(git merge-base HEAD "${upstream_ref}"); then
            echo "::error::The fork and upstream branches do not share history."
            exit 1
          fi

          behind=$(git rev-list --count "HEAD..${upstream_ref}")
          upstream_sha=$(git rev-parse "${upstream_ref}")
          echo "behind=${behind}" >> "${GITHUB_OUTPUT}"

          body_path="${RUNNER_TEMP}/upstream-sync-pr.md"
          {
            echo "## Upstream changes"
            echo
            echo "This merges **${behind} upstream-only commit(s)** from [${UPSTREAM_REPOSITORY}](https://github.com/${UPSTREAM_REPOSITORY})."
            echo
            git log --format='    %h  %s' --max-count=20 "HEAD..${upstream_ref}"

            if (( behind > 20 )); then
              echo
              echo "_...and $((behind - 20)) more commit(s)._"
            fi

            echo
            echo "[Compare the upstream range](https://github.com/${UPSTREAM_REPOSITORY}/compare/${merge_base}...${upstream_sha})"
            echo
            echo "> [!IMPORTANT]"
            echo "> Merge this PR with a **merge commit**. Squashing or rebasing rewrites the upstream commits, so the merge-base never advances and every future sync re-reports (and re-conflicts) the same commits."
            echo
            echo "---"
            echo "🤖 Generated by the [upstream sync workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/sync-upstream.yml)."
          } > "${body_path}"

      - name: Merge upstream into the fork branch
        if: steps.upstream.outputs.behind != '0'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            git merge --abort || true
            echo "::error::Upstream has merge conflicts with ${BASE_BRANCH}; resolve them manually. (If a previous sync PR was squash- or rebase-merged, that is the likely cause.)"
            exit 1
          fi

      - name: Create or update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PI_AGENTIC_UPSTREAM_SYNC_TOKEN }}
          branch: ${{ env.SYNC_BRANCH }}
          base: ${{ env.BASE_BRANCH }}
          delete-branch: true
          title: "⬆️ Upstream sync — ${{ steps.upstream.outputs.behind }} new commit(s)"
          body-path: ${{ runner.temp }}/upstream-sync-pr.md

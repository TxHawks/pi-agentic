name: Sync Upstream

on:
  schedule:
    # Every day at 08:00 UTC.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  SYNC_BRANCH: sync/upstream
  UPSTREAM_BRANCH: main
  UPSTREAM_REPOSITORY: edxeth/pi-subagents

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          # The PAT must authenticate the origin remote: the sync-branch push
          # needs it, and pushes with the default GITHUB_TOKEN would not
          # trigger CI on the sync pull request.
          token: ${{ secrets.PI_AGENTIC_UPSTREAM_SYNC_TOKEN }}

      - name: Fetch upstream and prepare pull request
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags --prune upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          upstream_ref="refs/remotes/upstream/${UPSTREAM_BRANCH}"
          if ! merge_base=$(git merge-base HEAD "${upstream_ref}"); then
            echo "::error::The fork and upstream branches do not share history."
            exit 1
          fi

          behind=$(git rev-list --count "HEAD..${upstream_ref}")
          upstream_sha=$(git rev-parse "${upstream_ref}")
          echo "behind=${behind}" >> "${GITHUB_OUTPUT}"

          body_path="${RUNNER_TEMP}/upstream-sync-pr.md"
          {
            echo "## Upstream changes"
            echo
            echo "This brings in **${behind} upstream-only commit(s)** from [${UPSTREAM_REPOSITORY}](https://github.com/${UPSTREAM_REPOSITORY})."
            echo
            git log --format='    %h  %s' --max-count=20 "HEAD..${upstream_ref}"

            if (( behind > 20 )); then
              echo
              echo "_...and $((behind - 20)) more commit(s)._"
            fi

            echo
            echo "[Compare the upstream range](https://github.com/${UPSTREAM_REPOSITORY}/compare/${merge_base}...${upstream_sha})"
            echo
            echo "> [!IMPORTANT]"
            echo "> Merge this PR with a **merge commit**. Squashing or rebasing rewrites the upstream commits, so the merge-base never advances and every future sync re-reports the same commits."
            echo
            echo "If GitHub reports merge conflicts, resolve them in this PR: merge \`${BASE_BRANCH}\` into \`${SYNC_BRANCH}\` (the web conflict editor does exactly that), then merge with a merge commit. When new upstream commits arrive, the sync workflow resets \`${SYNC_BRANCH}\` to the upstream branch and discards an open conflict resolution, so resolve and merge promptly."
            echo
            echo "Tip: to skip conflicts that only change whitespace (for example, tabs versus spaces), resolve locally: check out \`${SYNC_BRANCH}\`, run \`git merge -X ignore-all-space ${BASE_BRANCH}\`, resolve what remains, and push."
            echo
            echo "---"
            echo "🤖 Generated by the [upstream sync workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/sync-upstream.yml)."
          } > "${body_path}"

      - name: Push the upstream commits to the sync branch
        if: steps.upstream.outputs.behind != '0'
        shell: bash
        run: |
          set -euo pipefail

          upstream_ref="refs/remotes/upstream/${UPSTREAM_BRANCH}"
          sync_ref="refs/remotes/origin/${SYNC_BRANCH}"

          branch_exists=0
          if git fetch --no-tags origin "+refs/heads/${SYNC_BRANCH}:${sync_ref}"; then
            branch_exists=1
          fi

          # A force-push would erase an in-flight conflict resolution, so keep
          # the branch untouched while it already has every upstream commit.
          if [[ "${branch_exists}" == "1" ]] \
            && [[ "$(git rev-list --count "${sync_ref}..${upstream_ref}")" == "0" ]]; then
            echo "The sync branch already has every upstream commit; leaving it untouched."
            exit 0
          fi

          git push --force origin "${upstream_ref}:refs/heads/${SYNC_BRANCH}"

      - name: Create or update the pull request
        if: steps.upstream.outputs.behind != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PI_AGENTIC_UPSTREAM_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BEHIND: ${{ steps.upstream.outputs.behind }}
        run: |
          set -euo pipefail

          body_path="${RUNNER_TEMP}/upstream-sync-pr.md"
          title="⬆️ Upstream sync — ${BEHIND} new commit(s)"

          pr_number=$(gh pr list --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" \
            --state open --json number --jq '.[0].number // ""')

          if [[ -z "${pr_number}" ]]; then
            gh pr create --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" \
              --title "${title}" --body-file "${body_path}"
          else
            gh pr edit "${pr_number}" --title "${title}" --body-file "${body_path}"
          fi

      - name: Close the sync pull request when the fork is current
        if: steps.upstream.outputs.behind == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PI_AGENTIC_UPSTREAM_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_number=$(gh pr list --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" \
            --state open --json number --jq '.[0].number // ""')

          if [[ -n "${pr_number}" ]]; then
            gh pr close "${pr_number}" --delete-branch \
              --comment "The fork branch \`${BASE_BRANCH}\` already has every upstream commit, so this sync is obsolete."
          fi

# The local mirror of the Tier A gate: the same package scripts that
# .github/workflows/ci.yml runs, so a commit that passes here passes CI.
pre-commit:
  parallel: true
  commands:
    types:
      run: pnpm check:types
    lint:
      run: pnpm check:lint
    dead-code:
      run: pnpm check:dead-code
    file-sizes:
      run: pnpm check:file-sizes
    test:
      run: pnpm test
